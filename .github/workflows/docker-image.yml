name: Publish Docker Images

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build and Push (GHCR)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [client, server, agents]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image tags must be all-lowercase, but github.repository preserves the
      # owner's actual case (Zuck7/shopdesc.ai) — compute a lowercase copy once
      # and reuse it below.
      - name: Compute lowercase image repository
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_REPO }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
